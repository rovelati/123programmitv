name: Build & Deploy

permissions:
  contents: write

on:
  # Ogni giorno alle 03:30 ora di Roma (02:30 UTC in estate, 03:30 in inverno)
  # L'EPG importer gira alle 01:00 → 2h di margine abbondante
  schedule:
    - cron: '30 1 * * *'   # 03:30 CEST (UTC+2, estate)

  # Trigger manuale da GitHub UI o via API
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (Node adapter — SSG)
        run: npm run build:node
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}

      # Hostinger blocca connessioni SSH in ingresso da GitHub runners (timeout).
      # Pubblicazione alternativa: push del build statico su branch dedicato.
      # Il server Hostinger fa pull di questo branch e rsync locale verso public_html.
      - name: Publish static build to deploy branch
        run: |
          DEPLOY_BRANCH="deploy-static"
          rm -rf .deploy-tmp
          mkdir -p .deploy-tmp
          cp -R dist/client/. .deploy-tmp/

          git switch --orphan "$DEPLOY_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          cp -R .deploy-tmp/. .
          rm -rf .deploy-tmp

          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "deploy: publish static build" || true
          git push --force origin "$DEPLOY_BRANCH"

      - name: Done
        run: echo "✅ Deploy completato — $(date '+%Y-%m-%d %H:%M:%S UTC')"
