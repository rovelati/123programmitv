name: Build & Deploy

permissions:
  contents: read
  deployments: write

on:
  # Ogni giorno alle 03:30 ora di Roma (02:30 UTC in estate, 03:30 in inverno)
  # L'EPG importer gira alle 01:00 → 2h di margine abbondante
  schedule:
    - cron: '30 1 * * *'   # 03:30 CEST (UTC+2, estate)

  # Trigger manuale da GitHub UI o via Deploy Hook Cloudflare
  workflow_dispatch:

  # Push su main (es. aggiornamenti codice)
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (Cloudflare adapter)
        run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          ASTRO_ADAPTER: cloudflare

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 123programmitv
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Done
        run: echo "✅ Deploy completato — $(date '+%Y-%m-%d %H:%M:%S UTC')"
