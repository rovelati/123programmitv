name: Build & Deploy

permissions:
  contents: read
  deployments: write

on:
  # Contabo: EPG ~01:00, rebuild locale 02:15 Europe/Rome → questo job è backup/manual
  schedule:
    - cron: '30 1 * * *'   # 03:30 CEST

  workflow_dispatch:

  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'public/seo-data/**'
      - 'public/search-console/**'

jobs:
  # Build + deploy su Contabo (Postgres locale). GitHub Actions non raggiunge
  # 127.0.0.1 Contabo e il progetto Supabase IT non risolve più (NXDOMAIN).
  build-and-deploy:
    name: Build & Deploy (Contabo)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Build + deploy on Contabo VPS
        env:
          CONTABO_SSH_KEY: ${{ secrets.CONTABO_SSH_KEY }}
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
        run: |
          set -euo pipefail
          if [ -z "${CONTABO_SSH_KEY:-}" ] || [ -z "${CONTABO_HOST:-}" ]; then
            echo "::error::Missing CONTABO_SSH_KEY or CONTABO_HOST secrets"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$CONTABO_SSH_KEY" > ~/.ssh/contabo_key
          chmod 600 ~/.ssh/contabo_key
          ssh-keyscan -H "$CONTABO_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/contabo_key -o StrictHostKeyChecking=no -o IdentitiesOnly=yes \
            "root@${CONTABO_HOST}" \
            '/var/www/123programmitv.it/astro/scripts/rebuild-and-deploy-vps.sh'
