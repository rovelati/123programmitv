name: Build & Deploy

permissions:
  contents: read
  deployments: write

on:
  # Ogni giorno alle 03:30 ora di Roma (02:30 UTC in estate, 03:30 in inverno)
  # L'EPG importer gira alle 01:00 → 2h di margine abbondante
  schedule:
    - cron: '30 1 * * *'   # 03:30 CEST (UTC+2, estate)

  # Trigger manuale da GitHub UI o via Deploy Hook Cloudflare
  workflow_dispatch:

  # Push su main (es. aggiornamenti codice)
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (Node adapter — genera file statici in dist/client/)
        # Il Cloudflare adapter fallisce in CI per un bug del Workers runner di
        # @cloudflare/vite-plugin (require_dist). Il Node adapter produce gli
        # stessi file statici in dist/client/ che vengono deployati su CF Pages.
        # Le pagine /programma/ SSR vengono gestite da una CF Function separata.
        run: npm run build:node
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SITE_URL: ${{ secrets.SITE_URL }}
          # Google SA key per generate-seo-dashboard.js (postbuild).
          # Se assente, lo script scrive un placeholder e il build continua.
          GOOGLE_SA_KEY_JSON: ${{ secrets.GOOGLE_SA_KEY_JSON }}

      - name: Sync locally stored program images
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "DEPLOY_SSH_KEY secret is required to sync local program images." >&2
            exit 1
          fi

          mkdir -p ~/.ssh dist/client/images/programs
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 65002 89.116.147.83 >> ~/.ssh/known_hosts 2>/dev/null || true
          rsync -az --checksum \
            -e "ssh -p 65002 -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=~/.ssh/known_hosts" \
            u914016995@89.116.147.83:/home/u914016995/domains/123programmitv.it/public_html/images/programs/ \
            dist/client/images/programs/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 123programmitv
          directory: dist/client
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate live SEO
        run: npm run validate:seo
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          SEO_VALIDATE_ATTEMPTS: 3
          SEO_VALIDATE_RETRY_MS: 30000

      - name: Done
        run: echo "✅ Deploy completato — $(date '+%Y-%m-%d %H:%M:%S UTC')"
