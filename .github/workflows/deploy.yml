name: Build & Deploy

on:
  # Ogni giorno alle 03:30 ora di Roma (02:30 UTC in estate, 03:30 in inverno)
  # L'EPG importer gira alle 01:00 → 2h di margine abbondante
  schedule:
    - cron: '30 1 * * *'   # 03:30 CEST (UTC+2, estate)

  # Trigger manuale da GitHub UI o via API
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (Node adapter — SSG)
        run: npm run build:node
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 65002 89.116.147.83 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy via rsync
        run: |
          rsync -av --checksum --delete \
            --exclude='api' \
            --exclude='ads.txt' \
            -e "ssh -p 65002 -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            dist/client/ \
            u914016995@89.116.147.83:/home/u914016995/domains/123programmitv.it/public_html/

      - name: Done
        run: echo "✅ Deploy completato — $(date '+%Y-%m-%d %H:%M:%S UTC')"
