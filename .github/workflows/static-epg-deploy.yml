name: Static EPG Deploy

permissions:
  contents: read
  deployments: write

on:
  workflow_dispatch:

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate static EPG site
        run: python3 scripts/generate-static-epg-site.py
        env:
          SITE_URL: https://123programmitv.it
          STATIC_EPG_OUT_DIR: static-epg-dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 123programmitv
          directory: static-epg-dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate live SEO
        run: npm run validate:seo
        env:
          SITE_URL: https://123programmitv.it
          SEO_VALIDATE_ATTEMPTS: 3
          SEO_VALIDATE_RETRY_MS: 30000
